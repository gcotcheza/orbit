# The layers of docs/PLAN.md, executed. Why these six and how an exception is
# recorded: docs/DECISIONS.md, the-layer-rule-is-executed-not-reviewed.
deptrac:
  paths:
    - ./app

  layers:
    - name: Domain
      collectors:
        - type: directory
          value: app/Domain/.*

    - name: Application
      collectors:
        - type: directory
          value: app/Application/.*

    # app/Notifications is the mail-channel payload of the DealNotifier adapter and
    # has no other importer, so it sits in the adapter ring, not at the edge.
    - name: Infrastructure
      collectors:
        - type: directory
          value: app/(Infrastructure|Notifications)/.*

    - name: Eloquent
      collectors:
        - type: directory
          value: app/Models/.*

    - name: Queue
      collectors:
        - type: directory
          value: app/Jobs/.*

    - name: Edge
      collectors:
        - type: directory
          value: app/(Console|Http|Providers|Services)/.*

    # Everything Composer installed. `must_not: php_internal` keeps DateTimeImmutable
    # and friends out of it, so Domain may still be written in plain PHP.
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^(?!App\\).*#'
          must_not:
            - type: php_internal
              value: '.*'

  ruleset:
    # Nothing. This is "pure PHP, imports no framework" as a rule a machine can read.
    Domain: ~

    # Queue: a use case may dispatch a job; docs/DECISIONS.md carries the open question.
    Application:
      - Domain
      - Eloquent
      - Queue
      - Vendor

    Infrastructure:
      - Domain
      - Application
      - Eloquent
      - Vendor

    Eloquent:
      - Domain
      - Vendor

    Queue:
      - Domain
      - Application
      - Infrastructure
      - Eloquent
      - Vendor

    Edge:
      - Domain
      - Application
      - Infrastructure
      - Eloquent
      - Queue
      - Vendor

    Vendor: ~

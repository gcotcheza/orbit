# Reference copy of the host nginx vhost, to be installed on the VPS at
#   /etc/nginx/sites-available/flights-ghiecode
# (and symlinked into sites-enabled at go-live — see docs/PLAN.md, PR12; it is
# deliberately NOT enabled yet). Kept here so the config is reviewable and
# version-controlled; the file nginx actually reads is the one under /etc.
# After editing either copy: `nginx -t` BEFORE `systemctl reload nginx`.

# =============================================================================
# flights.ghiecode.io — Orbit (Laravel 13 / PHP 8.5 in Docker)
# =============================================================================
# Own origin rather than a subpath of ghiecode.io: the PWA needs its own
# service-worker scope and its own browser storage, which is exactly the
# collision Scribly and Reflection hit by sharing the apex.
#
# TLS follows the house pattern — the Cloudflare Origin CA certificate at
# /etc/ssl/ghiecode.io.{pem,key}, whose SANs are `*.ghiecode.io` and
# `ghiecode.io`, so this subdomain is already covered and no new cert or
# Let's Encrypt issuance is needed. Valid to 2041-02-17.
#
# The origin firewall only accepts 80/443 from Cloudflare ranges, so this
# server block is only ever reached through the Cloudflare edge (or from the
# box itself via --resolve). The record for `flights` must be PROXIED.
#
# Upstream: the orbit compose stack's nginx sidecar, published on
# 127.0.0.1:3085 only — same shape as reflection (3080) / scribly (3081) /
# kidsquest (3082) / health-tracker (3083).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name flights.ghiecode.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name flights.ghiecode.io;

    ssl_certificate     /etc/ssl/ghiecode.io.pem;
    ssl_certificate_key /etc/ssl/ghiecode.io.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    charset utf-8;

    # Orbit accepts no uploads. The largest body it ever legitimately sees is a
    # few hundred bytes of natural-language rule text, so 20m is already three
    # orders of magnitude of headroom and matches docker/web/nginx.conf — the
    # two must agree or the rejection happens somewhere nobody is looking.
    client_max_body_size 20m;
    client_body_timeout  120s;

    # Horizon's dashboard lists every queued job, exposes their payloads and
    # can retry them. It has no business being reachable from the internet, and
    # this 404 is the layer that does not depend on the application booting
    # correctly, on APP_ENV being right, or on a gate being wired up. The other
    # two layers are App\Providers\HorizonServiceProvider (403 unless local or
    # token-bearing) and the fact that the stack only publishes on loopback.
    #
    # ^~ so it wins over any regex location and covers /horizon/api/* too.
    location ^~ /horizon {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3085;
        proxy_http_version 1.1;

        # ---------------------------------------------------------------------
        # THE FORWARDING CHAIN STARTS HERE. IT DOES NOT CONTINUE FROM THE CLIENT.
        #
        # Every X-Forwarded-* header below is SET, never appended to, and every
        # header in the family is named even where the value looks obvious —
        # anything not named here is passed through from the client verbatim,
        # which is the whole bug this shape exists to prevent.
        #
        # X-Forwarded-For is NOT `$proxy_add_x_forwarded_for`, which would mean
        # "the client's X-Forwarded-For, plus $remote_addr". The app trusts its
        # proxies, and Symfony answers $request->ip() with the LEFTMOST entry
        # of that header — so the client's own value would win, and a login
        # guesser who changed it every attempt would get a fresh bucket out of
        # an `email|ip` throttle every attempt. $remote_addr is the right value
        # and the only one: /etc/nginx/conf.d/cloudflare-realip.conf has
        # already rewritten it from CF-Connecting-IP for every Cloudflare
        # range, so at this vhost it IS the true client, and there is no
        # earlier hop of our own whose address would be worth keeping.
        #
        # X-Forwarded-Host and -Port must be set rather than left alone, or a
        # client supplies them and decides the host and port of every URL the
        # app generates. -Prefix likewise, which Laravel trusts by default and
        # which prepends a path to those URLs. `Forwarded` is RFC 7239's
        # version of all of the above; Laravel's trusted-header set does not
        # include it today, and clearing it means that staying true is not
        # load-bearing. An empty value removes the header.
        #
        # bootstrap/app.php narrows trustProxies to RFC1918 as the second half
        # of this; neither half is sufficient alone.
        # ---------------------------------------------------------------------
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded          "";

        proxy_request_buffering off;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 15s;

        # NB: all add_header directives for this vhost must live here. nginx
        # does not merge across levels — a location with any add_header of its
        # own discards every one inherited from `server`.
        add_header X-Robots-Tag           "noindex, nofollow"                 always;
        add_header X-Frame-Options        "SAMEORIGIN"                        always;
        add_header X-Content-Type-Options "nosniff"                           always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Orbit asks the browser for no hardware at all: the globe is WebGL,
        # which needs no permission, and there is no camera, microphone or
        # location feature anywhere in design/README.md. So every entry in the
        # policy is empty — including `camera`, which health-tracker's copy of
        # this file grants to `self` for its barcode scanner. Copying that
        # grant across would have been a permission handed to an app that has
        # nothing to do with it.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # -- Content Security Policy, REPORT-ONLY --------------------------
        # Report-Only is not timidity, it is the only honest first step: this
        # is a Vue SPA whose exact runtime needs are not knowable by reading
        # nginx. Enforcing a wrong policy here does not degrade the app, it
        # blanks it — a blocked entry chunk renders a white page with a 200 and
        # no server-side symptom.
        #
        # Two clauses will be argued with once the globe is real:
        #
        #   img-src 'self' — globe.gl's stock textures are loaded from unpkg by
        #     URL (see design/README.md), and this policy says no. That is the
        #     intended answer: the Earth textures are ~1 MB of static image and
        #     belong in our own build output, not fetched from a CDN on every
        #     cold start of a phone app. PR5 vendors them; until it does, this
        #     header reports the violation rather than causing it.
        #   'unsafe-inline' in style-src — Vue writes inline styles for
        #     transitions and bound :style, and Vite injects a <style> block.
        #     There is no nonce plumbed through the root view yet, and
        #     inventing one is a bigger change than this file.
        #
        # `blob:` in img-src and worker-src is there for the globe's canvas
        # snapshots and any decoding moved off the main thread.
        #
        # NO report-uri / report-to, deliberately: there is no collector, and a
        # violation endpoint that nothing reads is worse than none. Findings
        # come from the browser console during a real session on the phone.
        # PROMOTE THIS to `Content-Security-Policy` (drop `-Report-Only`) once
        # a full tour of the globe, a rule creation and an alert have each been
        # done with the console open and produced no violation.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}

; =============================================================================
; Orbit — php-fpm pool overrides (loaded after www.conf / zz-docker.conf)
; =============================================================================
[www]
; Container env vars reach the app (Laravel still reads .env from the bind mount;
; this just means `docker compose ... environment:` is not silently swallowed).
clear_env = no

; Modest pool: single-user app, one phone. The expensive work (polling
; providers, scoring routes, sending alerts) happens on the queue in the
; `horizon` container, not in a request.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Must stay >= php.ini max_execution_time or a slow request gets SIGTERMed
; mid-write rather than returning an error the app chose.
request_terminate_timeout = 120s

catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

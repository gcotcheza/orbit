; =============================================================================
; Orbit — PHP runtime overrides
; =============================================================================
; Orbit takes no large uploads: it POSTs a few hundred bytes of rule text and
; reads fares from upstream APIs on the queue. The ceilings are therefore small
; on purpose — the sidecar allows 20m and PHP sits just above it, so nginx is
; the thing that rejects an oversized body and PHP is never the thing that
; silently truncates one.
; =============================================================================

memory_limit = 256M
post_max_size = 24M
upload_max_filesize = 20M
max_file_uploads = 20

max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

expose_php = Off

; Never split SCRIPT_FILENAME into script + PATH_INFO looking for something
; executable. The sidecar sets SCRIPT_FILENAME to a fully resolved path and
; refuses to forward a request whose script does not exist (`try_files $uri
; =404` in docker/web/nginx.conf), so this changes nothing about how the app is
; served — it removes the fallback that makes "/anything.jpg/x.php" a class of
; bug in the first place. Two independent layers, because the interesting
; failures here are the ones where one of them is misconfigured.
;
; Laravel never reads PATH_INFO: Symfony derives the path from REQUEST_URI.
cgi.fix_pathinfo = 0

; The app stores and computes in UTC. Europe/Amsterdam is a DISPLAY and
; SCHEDULING concern (ORBIT_TIMEZONE in .env) — which calendar day a fare is
; for, and when the Sunday digest goes out — and lives in config, not here.
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

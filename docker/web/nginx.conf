# =============================================================================
# Orbit — in-stack nginx (FastCGI sidecar)
# =============================================================================
# The host's nginx terminates TLS and proxy_passes plain HTTP to this container
# on 127.0.0.1:3085 — the same shape as reflection (3080) / scribly (3081) /
# kidsquest (3082) / health-tracker (3083). This sidecar exists only because
# php-fpm speaks FastCGI, not HTTP.
#
# Runs as a non-root uid, so: unprivileged listen port, pid + temp paths under
# /tmp, logs to stdout/stderr. The container's root filesystem is read-only
# (see docker-compose.yml) and /tmp is a tmpfs — that is the whole reason those
# paths are moved rather than left at their defaults.
# =============================================================================

worker_processes  auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    # -------------------------------------------------------------------------
    # "No 404s in the log" has to be able to mean something.
    #
    # The asset locations below turn access logging OFF, because every launch of
    # the app is a dozen 200s for hashed files nobody wants to read about. The
    # cost of that only becomes visible when a phone shows a blank white page:
    # the first thing anyone checks is whether the bundle 404'd, the log says
    # nothing, and the log saying nothing gets taken as evidence that nothing
    # 404'd. It is not evidence of anything — those requests were never being
    # written down at all.
    #
    # So: silence the 200s, keep the failures. A miss on a build asset is the
    # single most diagnostic line this server can emit — it names the exact
    # hashed file some page is still asking for after a deploy deleted it.
    # -------------------------------------------------------------------------
    map $status $asset_failed {
        ~^[23]  0;
        default 1;
    }

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Matches the host vhost. Orbit accepts no uploads — the largest body it
    # ever sees is a few hundred bytes of natural-language rule text — so this
    # is a ceiling nothing legitimate comes near.
    client_max_body_size 20m;
    client_body_buffer_size 1m;

    server {
        listen      8080;
        server_name _;

        root  /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Vite's build output. Every filename in here carries a content hash, so
        # a changed file is a changed URL and `immutable` is simply true — the
        # browser is told never to revalidate. That matters more here than most
        # places: the globe ships three.js and globe.gl, which is the biggest
        # chunk this app will ever send to a phone on mobile data.
        #
        # `^~` so it wins over the regex locations, and `=404` rather than
        # falling through to index.php — a missing asset must be a 404, not an
        # HTML page with a 200. One explicit header rather than nginx's
        # `expires` directive, which would emit a SECOND Cache-Control line.
        #
        # Logging: successes off, failures on. See the `$asset_failed` map above.
        location ^~ /build/ {
            access_log /dev/stdout combined if=$asset_failed;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Home-screen icons, which arrive with the PWA. Unlike /build/ these
        # filenames carry no content hash — they are named in the manifest and
        # in <link> tags, and renaming them on every build would mean a new
        # home-screen icon after every deploy. So: cacheable, but NOT immutable.
        # A week is long enough that the phone never refetches them in practice
        # and short enough that a deploy which regenerates them is picked up.
        #
        # `/manifest.webmanifest` and `/sw.js` are deliberately NOT here: both
        # will be served by PHP, which is where their content types and cache
        # policy belong.
        location ^~ /icons/ {
            access_log /dev/stdout combined if=$asset_failed;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            # First line, and it has to be: without it this block hands ANY path
            # ending in .php to php-fpm and lets php-fpm decide what to do with
            # a script that does not exist. `=404` is nginx's own answer
            # instead, so a request never reaches the FastCGI socket unless the
            # file it names is really there. The server-level `error_page 404
            # /index.php` still turns that into the app's own not-found page —
            # the internal redirect re-enters this block with $uri = /index.php,
            # which does exist.
            #
            # Note what this block does NOT do: it does not touch
            # X-Forwarded-For or X-Forwarded-Host. nginx passes client headers
            # to FastCGI as HTTP_* parameters unchanged, and this sidecar has no
            # idea who the client is — it sees the bridge gateway. The one place
            # that knows is the host vhost, which is where the forwarding chain
            # is reset. Setting anything here would only replace a true value
            # with a wrong one.
            try_files      $uri =404;

            fastcgi_pass   app:9000;
            fastcgi_index  index.php;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param  DOCUMENT_ROOT   $realpath_root;

            fastcgi_read_timeout 120s;
            fastcgi_send_timeout 120s;
            fastcgi_buffer_size  32k;
            fastcgi_buffers      16 16k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}

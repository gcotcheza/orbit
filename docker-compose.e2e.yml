# =============================================================================
# Orbit — E2E sandbox stack
# =============================================================================
# A THROWAWAY COPY OF PRODUCTION, so that a browser can be pointed at the real
# app instead of at a mock. Four services — app, web, postgres, redis — and
# every one of them is disposable: `scripts/e2e.sh` builds this stack, migrates
# it, seeds it with fake fares, drives Chromium against it and then destroys it
# volumes and all.
#
# ---------------------------------------------------------------------------
# WHAT KEEPS THIS OFF THE LIVE STACK, which shares this checkout's code
# ---------------------------------------------------------------------------
#   1. `name: orbit-e2e`. The production file declares `name: orbit`, and a
#      compose project name is what every `up`, `down`, `exec` and `down -v`
#      resolves containers, networks AND VOLUMES through. Two names is two
#      stacks that cannot see each other's anything.
#   2. `127.0.0.1:3185`, not 3085. Loopback for the same reason production is
#      (nothing here is reachable off the box), and a different port so the two
#      can be up at the same time — which they routinely are, because the live
#      site does not go down so that a test can run.
#   3. Its own env file, `.env.e2e`, generated by scripts/e2e.sh and never
#      committed: a fresh APP_KEY, a throwaway database password and a SEEDED
#      LOGIN THAT EXISTS NOWHERE ELSE. Production credentials are not "reused
#      carefully" here; they are absent.
#   4. `ORBIT_E2E` is a REQUIRED variable (see the app service). Compose refuses
#      to start this file with any other env file, including the checkout's own
#      `.env` — which is what stops a stray `docker compose -f
#      docker-compose.e2e.yml up` from pointing the sandbox at real credentials.
#
# ---------------------------------------------------------------------------
# HOW IT DIFFERS FROM docker-compose.yml, AND WHY EACH DIFFERENCE IS DELIBERATE
# ---------------------------------------------------------------------------
#   - NO horizon, NO scheduler. `.env.e2e` sets QUEUE_CONNECTION=sync, so every
#     job a request dispatches runs inline, inside that request. A test that
#     taps a button and then waits to see whether a worker got round to the
#     job is a test that fails on a slow afternoon; running the job in the
#     request makes the assertion the button's own. The scheduler has nothing
#     to do in a stack that lives for ninety seconds.
#   - NO assets service. The bundle is built once, before the stack comes up —
#     see scripts/e2e.sh. Building inside the stack would put a task with no
#     port in a file whose whole purpose is one port.
#   - POSTGRES ON tmpfs. The database is regenerated by `migrate` + `db:seed`
#     on every run and read by nothing afterwards, so a named volume would be
#     a disk write per fake fare and a volume to remember to delete. RAM is
#     also the honest description of its lifetime.
#   - REDIS WITHOUT PERSISTENCE. Same reasoning: it holds a cache and a rate
#     limiter for the length of one run.
#
# Hardening (non-root uid, no-new-privileges, cap_drop, the read-only web
# sidecar) is COPIED FROM PRODUCTION RATHER THAN RELAXED. A sandbox that is
# easier to run than the thing it stands in for stops predicting it — the
# point of driving a browser at this stack is that what the browser sees is
# what a phone would see.
#
# Usage: don't. Use `scripts/e2e.sh`, which owns the whole sequence.
# =============================================================================
name: orbit-e2e

services:
  # --- PHP 8.5 / Laravel 13 -------------------------------------------------
  app:
    build:
      context: ./docker/app
      args:
        APP_UID: '115'
        APP_GID: '119'
    image: orbit/app:latest
    user: '115:119'
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    environment:
      # THE GUARD, and the only reason this service has an `environment` block.
      # `:?` makes compose FAIL rather than default, so `docker compose -f
      # docker-compose.e2e.yml up` without `--env-file .env.e2e` stops here
      # instead of booting the sandbox against whatever `.env` happens to hold.
      # It is also read by the app: config/orbit.php gates the frozen clock on it.
      ORBIT_E2E: '${ORBIT_E2E:?docker-compose.e2e.yml needs --env-file .env.e2e — run scripts/e2e.sh instead}'
    volumes:
      - './:/var/www/html'
      # `.env.e2e` IS the sandbox's `.env`, mounted over the checkout's one.
      # The alternative — copying it into place before `up` and deleting it
      # after — is a copy that survives a crash, and the file it overwrites is
      # the one `scripts/check.sh` and the live stack read.
      - './.env.e2e:/var/www/html/.env:ro'
    networks:
      - orbit-e2e
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- nginx sidecar: FastCGI -> HTTP on the loopback port ------------------
  web:
    image: nginx:alpine
    user: '115:119'
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    read_only: true
    tmpfs: ['/tmp']
    # HARDCODED, exactly as production hardcodes 3085 and for the same reason:
    # the loopback binding is the security boundary, and a boundary that can be
    # moved by editing an env file is one that can be moved by accident. 3185
    # is the sandbox's own port and belongs to nothing else on this box.
    ports:
      - '127.0.0.1:3185:8080'
    volumes:
      - './:/var/www/html:ro'
      - './docker/web/nginx.conf:/etc/nginx/nginx.conf:ro'
    networks:
      - orbit-e2e
    depends_on:
      - app
    healthcheck:
      # The sidecar answers 400 to a request with no Host it recognises — see
      # the trusted-host list in bootstrap/app.php — so the check sends the one
      # the app is configured for. It is checking that nginx and php-fpm are
      # talking, not that the app is happy.
      test:
        - 'CMD-SHELL'
        - 'wget -qO- --header="Host: flights.ghiecode.io" http://127.0.0.1:8080/up | grep -q "Application up"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --- Postgres 18, in RAM --------------------------------------------------
  postgres:
    image: postgres:18-alpine
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker and declares the
    # VOLUME one level up, so the tmpfs goes on the parent — the same path the
    # production file mounts its named volume at. 256 MB is initdb (~40 MB)
    # plus sixty days of fake fares for six routes with room to spare; it is a
    # CEILING on how much of this box's memory a test run can take, which is
    # the point of naming it.
    tmpfs:
      - '/var/lib/postgresql:size=256m'
    networks:
      - orbit-e2e
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "${DB_USERNAME}" -d "${DB_DATABASE}"']
      interval: 3s
      timeout: 5s
      retries: 20

  # --- Redis ----------------------------------------------------------------
  # Authenticated, exactly as production is: the sandbox is meant to predict
  # production, and "it worked locally without the password" is the specific
  # surprise this stack exists to prevent.
  #
  # `--save ''` and no appendonly: nothing here outlives the run, and an RDB
  # dump into a container that is about to be deleted is a disk write for
  # nobody.
  redis:
    image: redis:alpine
    security_opt: ['no-new-privileges:true']
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
    command:
      - 'sh'
      - '-euc'
      - |
        if [ -z "$${REDIS_PASSWORD:-}" ] || [ "$${REDIS_PASSWORD}" = 'null' ]; then
            exec redis-server --save '' --appendonly no
        fi
        exec redis-server --save '' --appendonly no --requirepass "$${REDIS_PASSWORD}"
    networks:
      - orbit-e2e
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >-
          if [ -z "$${REDIS_PASSWORD:-}" ] || [ "$${REDIS_PASSWORD}" = 'null' ];
          then redis-cli ping;
          else redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping; fi
          | grep -q PONG
      interval: 3s
      timeout: 5s
      retries: 20

networks:
  orbit-e2e:
    driver: bridge
